<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMeeting · 用规则，改变开会的文化</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/site.css">
<script id="__console_forward">
(function(){
  if (!window.parent || window.parent === window) return;
  ['error','warn','log','info'].forEach(function(k){
    var orig = console[k].bind(console);
    console[k] = function(){
      try { window.parent.postMessage({ __console: '[' + k + '] ' + Array.from(arguments).map(String).join(' ').slice(0, 400) }, '*'); } catch(e){}
      orig.apply(null, arguments);
    };
  });
  window.addEventListener('error', function(e){
    try { window.parent.postMessage({ __console: '[uncaught] ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno }, '*'); } catch(err){}
  });
})();
</script>
</head>

<div id="root">
  <div style="min-height:60vh;display:grid;place-items:center;font-family:Menlo,monospace;font-size:13px;color:#a9afb7;">

</div>

</body>
